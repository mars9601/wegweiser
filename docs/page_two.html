  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root{
      --bg:#ffffff; --card:#ffffff; --accent:#023d6b; --muted:#555; --radius:10px; --transition:300ms cubic-bezier(.2,.9,.25,1);
      --btn-bg:#ddd; --btn-color:#000;
    }
    body.dark{
      --bg:#0f1724; --card:#0b1220; --accent:#60a5fa; --muted:#98a0b3;
      --btn-bg:#333; --btn-color:#fff;
    }
    html,body{height:100%; margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;}
    body{
      background:var(--bg); color:#0a0a0a;
      display:flex; align-items:flex-start; justify-content:center;
      padding:40px; transition: background 0.3s, color 0.3s;
    }

    .card{
      background:var(--card); padding:18px; border-radius:var(--radius);
      width:980px; max-width:96vw; box-shadow:0 8px 30px rgba(0,0,0,0.1);
      position:relative;
    }
    h1{margin:0 0 12px 0; font-size:18px; color:var(--accent)}
    p.small{margin:0 0 14px 0; color:var(--muted); font-size:13px}

    .tree{display:flex; gap:20px}
    .tree-panel{flex:1}

    /* Knoten als Button – nativ fokussierbar und per Tastatur bedienbar */
    .node{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      padding:8px 10px;
      margin-bottom:6px;
      border:1px solid transparent;
      border-radius:8px;
      background:rgba(2,61,107,0.05);
      color:#0a0a0a;
      font:inherit;
      font-size:inherit;
      text-align:left;
      cursor:pointer;
      user-select:none;
      transition:background var(--transition), transform var(--transition);
    }
    .node:hover{
      transform:translateY(-2px);
      background:rgba(2,61,107,0.1);
    }
    /* Fokus-Ring – deutlich sichtbar für Tastatur-Navigation */
    .node:focus-visible{
      outline:3px solid var(--accent);
      outline-offset:2px;
    }
    .node:focus:not(:focus-visible){
      outline:none;
    }

    #themeToggle, #homeButton {
      position:absolute;
      top:12px;
      width:36px;
      height:36px;
      border:none;
      border-radius:50%;
      background:var(--btn-bg);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition: background 0.3s;
    }
    #themeToggle svg, #homeButton svg {
      width:18px;
      height:18px;
      fill:var(--btn-color);
      stroke:var(--btn-color);
      transition: fill 0.3s, stroke 0.3s;
    }
    #themeToggle:focus-visible,
    #homeButton:focus-visible{
      outline:3px solid var(--accent);
      outline-offset:2px;
    }

    #themeToggle { right:12px; }
    #homeButton { right:56px; }

    /* Nur für Screenreader sichtbar */
    .sr-only{
      position:absolute;
      width:1px; height:1px;
      padding:0; margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
  </style>
</head>

    const root = document.getElementById('tree-root');
    const themeBtn = document.getElementById('themeToggle');
    const homeBtn = document.getElementById('homeButton');
    let stack = [];

    // Hilfsfunktion: hex + alpha -> rgba(...)
    function hexToRgba(hex, alpha){
      const h = hex.replace('#','');
      const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
      const v = parseInt(full,16);
      const r = (v >> 16) & 255;
      const g = (v >> 8) & 255;
      const b = v & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function activateNode(item){
      if(item.link){
        window.open(item.link, '_blank');
        return;
      }
      if(item.children && item.children.length){
        stack.push(item);
        renderLevel(item.children);
      }
    }

    function renderLevel(items){
      root.innerHTML='';
      const current = stack.length===0 ? null : stack[stack.length-1];
      const currentColor = current && current.color ? current.color : null;

      if(stack.length>0){
        const backBtn = document.createElement('button');
        backBtn.className = 'node';
        backBtn.textContent = '← Zurück';
        backBtn.setAttribute('aria-label', 'Eine Ebene zurück');
        backBtn.style.borderColor = currentColor || 'var(--accent)';
        backBtn.style.background = currentColor ? hexToRgba(currentColor, 0.06) : 'var(--btn-bg)';
        backBtn.style.color = 'var(--btn-color)';
        backBtn.onclick = () => {
          stack.pop();
          const prev = stack.length===0 ? treeData : stack[stack.length-1].children;
          renderLevel(prev);
        };
        backBtn.onkeydown = (e) => {
          if(e.key === 'Enter' || e.key === ' '){
            e.preventDefault();
            backBtn.click();
          }
        };
        root.appendChild(backBtn);
      }

      items.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'node';
        btn.textContent = item.label;
        btn.setAttribute('role', 'treeitem');
        btn.style.borderColor = item.color || '#888';
        btn.style.background = hexToRgba(item.color || '#888', 0.50);
        btn.style.color = 'var(--btn-color)';

        // Barrierefreiheit: angeben ob der Knoten aufklappbar ist
        if(item.children && item.children.length > 0){
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-label', item.label + ' – aufklappbar');
        } else if(item.link){
          btn.setAttribute('aria-label', item.label + ' – Link öffnet in neuem Tab');
        } else {
          btn.setAttribute('aria-label', item.label + ' – Endknoten');
        }

        btn.onclick = () => activateNode(item);
        btn.onkeydown = (e) => {
          if(e.key === 'Enter' || e.key === ' '){
            e.preventDefault();
            activateNode(item);
          }
        };
        root.appendChild(btn);

      });

      // Focus auf das erste Element setzen, wenn die Ansicht wechselt
      const firstFocusable = root.querySelector('.node');
      if(firstFocusable){
        firstFocusable.focus();
      }
    }

    renderLevel(treeData);

    themeBtn.onclick = () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeBtn.innerHTML = isDark ? moonSVG : sunSVG;
      themeBtn.setAttribute('aria-label', isDark ? 'Helles Farbschema umschalten' : 'Dark-Modus umschalten');
    };

    homeBtn.onclick = () => {
      stack = [];
      renderLevel(treeData);
    };
